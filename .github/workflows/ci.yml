name: ShopFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_only_secret_key_at_least_32_chars

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, lint-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build ./backend -t shopflow-backend:${{ github.sha }}

      - name: Build frontend
        run: docker build ./frontend -t shopflow-frontend:${{ github.sha }}

      - name: Summary
        run: |
          echo "✅ Build successful!"
          echo "Commit: ${{ github.sha }}"
